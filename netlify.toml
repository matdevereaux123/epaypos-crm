# Netlify build settings.
#
# This repo is not just the site — it also carries database/, supabase/
# and emails/, none of which should be publicly downloadable. Publishing
# `app` rather than the repo root serves the CRM at the site root AND
# keeps everything outside app/ off the public site.
#
# There is no build step: app/index.html is the entire application.

[build]
  publish = "app"

# ---------------------------------------------------------------------------
# Pretty routes for the public pages.
#
#   /r/<slug>      a partner's referral link
#   /apply/<slug>  an application or lead form
#
# status 200 is a rewrite, not a redirect: the browser keeps showing
# /r/joe-smith while Netlify serves index.html underneath. A 301 would work
# too but the address bar would flip to /?ref=joe-smith, which is exactly the
# thing these routes exist to avoid — a partner hands this link out on
# printed material.
#
# Because the URL never changes, the app reads the slug from the PATH rather
# than a query string. See initAuth() in app/index.html.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/apply/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Google's OAuth redirect lands here.
#
# Netlify would serve app/oauth/google.html at /oauth/google on its own, but
# Google matches redirect URIs byte for byte and will not follow a redirect —
# so this is spelled out as a rewrite rather than left to a default that could
# change or add a trailing slash.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/oauth/google"
  to = "/oauth/google.html"
  status = 200
