# Netlify build settings.
#
# This repo is not just the site — it also carries database/, supabase/
# and emails/, none of which should be publicly downloadable. Publishing
# `app` rather than the repo root serves the CRM at the site root AND
# keeps everything outside app/ off the public site.
#
# The only build step stamps the version onto the login screen — see
# tools/stamp-version.sh. app/index.html is otherwise the entire
# application, shipped exactly as it is committed.

[build]
  publish = "app"
  command = "sh tools/stamp-version.sh"

# ---------------------------------------------------------------------------
# Pretty routes for the public pages.
#
#   /r/<slug>      a partner's referral link
#   /apply/<slug>  an application or lead form
#   /book/<slug>   a personal booking link (database/53_booking_links.sql)
#
# status 200 is a rewrite, not a redirect: the browser keeps showing
# /r/joe-smith while Netlify serves index.html underneath. A 301 would work
# too but the address bar would flip to /?ref=joe-smith, which is exactly the
# thing these routes exist to avoid — a partner hands this link out on
# printed material.
#
# Because the URL never changes, the app reads the slug from the PATH rather
# than a query string. See initAuth() in app/index.html.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# The EPAY admin portal (ADR-0016 in the POS repo).
#
# A separate application, built from apps/back-office in the POS monorepo and
# dropped in at app/admin/. It is served from THIS origin on purpose: same
# origin means it reads the Control Center session already in storage, so
# nobody signs in twice. A subdomain would be a different origin and would
# need an OAuth exchange to get back what the path gives for nothing.
#
# The exact-file rules come first so the bundle and the page are served as
# themselves. The catch-all underneath hands anything deeper to index.html,
# because the portal routes in the browser — /admin/merchants is a screen,
# not a file, and without this it is a 404 on reload.
#
# `force = false` on the catch-all, so a real file always wins over it.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/apply/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/book/*"
  to = "/index.html"
  status = 200

# The e-signature link a client gets by email (database/69_esignature.sql).
[[redirects]]
  from = "/sign/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Google's OAuth redirect lands here.
#
# Netlify would serve app/oauth/google.html at /oauth/google on its own, but
# Google matches redirect URIs byte for byte and will not follow a redirect —
# so this is spelled out as a rewrite rather than left to a default that could
# change or add a trailing slash.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/oauth/google"
  to = "/oauth/google.html"
  status = 200
