<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{EMAIL_SUBJECT}}</title>
</head>
<body style="margin:0; padding:0; background-color:#F4F7FB; font-family:Arial, Helvetica, sans-serif;">

  <!-- Preheader (hidden preview text in the inbox list) -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
    {{PREHEADER_TEXT}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F7FB; padding:32px 16px;">
    <tr>
      <td align="center">

        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:480px; max-width:100%; background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #E4E9F2;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#ffffff; padding:24px; border-bottom:1px solid #E4E9F2;">
              <img src="{{LOGO_URL}}" alt="{{BRAND_NAME}}" width="90" style="display:block;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px 26px;">
              <h1 style="margin:0 0 14px; font-family:Arial, Helvetica, sans-serif; font-size:19px; color:#142850;">
                {{EMAIL_HEADING}}
              </h1>
              <p style="margin:0 0 16px; font-size:14px; line-height:1.6; color:#22406F;">
                {{EMAIL_BODY}}
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 22px;">
                <tr>
                  <td align="center" style="border-radius:8px; background-color:#0558D6;">
                    <a href="{{BUTTON_URL}}" target="_blank" style="display:inline-block; padding:13px 30px; font-size:14px; font-weight:bold; color:#ffffff; text-decoration:none; font-family:Arial, Helvetica, sans-serif;">
                      {{BUTTON_TEXT}} &rarr;
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 16px; font-size:14px; line-height:1.6; color:#22406F;">
                {{CLOSING_TEXT}}
              </p>
              <p style="margin:0; font-size:14px; line-height:1.6; color:#22406F;">
                &mdash; The {{BRAND_NAME}} Team
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color:#F4F7FB; padding:16px 24px; font-size:11px; color:#5B6B8C;">
              {{BRAND_NAME}} &middot; 185 E Big Beaver Rd, Troy, MI 48083 &middot; {{BRAND_DOMAIN}}
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
