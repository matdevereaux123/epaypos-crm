<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Add to Home Screen on an iPad runs it full-screen, without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EPAY POS" />
    <meta name="format-detection" content="telephone=no" />
    <title>EPAY Back Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* --- iPad / iOS Safari -------------------------------------------------
         `height: 100%` is the height of a viewport Safari collapses as you
         scroll, so the bottom of a fixed layout gets cut off. dvh is the
         visible height and updates as the toolbars move. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      body {
        /* Stops iOS inflating text in landscape. */
        -webkit-text-size-adjust: 100%;
        /* No grey flash on every tap. */
        -webkit-tap-highlight-color: transparent;
        /* Removes the 300ms double-tap-to-zoom delay without disabling pinch
           zoom, which would fail WCAG. Buttons feel immediate. */
        touch-action: manipulation;
        /* No rubber-band bounce dragging the whole register around. */
        overscroll-behavior: none;
      }
      /* Touch only: a cashier dragging a finger should not select label text.
         Scoped to coarse pointers so a laptop keeps normal selection and copy —
         the same file runs on both. Inputs always allow selection so a PIN or a
         barcode can be corrected. */
      @media (pointer: coarse) {
        body,
        button,
        [role='button'] {
          -webkit-user-select: none;
          user-select: none;
        }
        input,
        textarea {
          -webkit-user-select: text;
          user-select: text;
        }
      }
    </style>
    <script type="module" crossorigin src="/admin/assets/index-wcRLQm9u.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
